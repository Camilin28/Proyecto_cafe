server.port=8080

# URL del microservicio Python de inferencia (FastAPI)
inferencia.service.url=http://localhost:8000

# Base de datos H2 en archivo (simple para el prototipo; migrar a
# PostgreSQL/MySQL cuando pasen a producción o a la app móvil final)
spring.datasource.url=jdbc:h2:file:./data/cafe-deficiencias
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB